[package]
name = "csd-rs"
version = "0.1.6"
authors = ["Wai-Shing Luk <luk036@gmail.com>"]
edition = "2021"
rust-version = "1.66"
description = "Canonical Signed Digit Conversion in Rust"
readme = "README.md"
homepage = "https://luk036.github.io/csd-rs/"
repository = "https://github.com/luk036/csd-rs"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "src/doc-header.html"]

[lib]
name = "csd"
path = "src/lib.rs"

[[bin]]
name = "csd-rs"
path = "src/main.rs"

[dependencies]
env_logger = { version = "0.11.10", optional = true }
log = { version = "0.4.32", optional = true }
svgbobdoc = { version = "0.3", default-features = false }

[dev-dependencies]
quickcheck = "1.1.0"
quickcheck_macros = "1.2.0"
criterion = "0.8.2"
serial_test = "3.5.0"

[features]
default = ["multiplier", "lcsre"]
multiplier = []
lcsre = []
std = ["dep:env_logger", "dep:log"]
docsrs = ["svgbobdoc/enable"]

[[bench]]
name = "csd_benchmark"
harness = false

[profile.bench]
debug = true
